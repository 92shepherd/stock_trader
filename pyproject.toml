[project]
name = "stock-trader"
version = "0.1.0"
description = "KOSPI+KOSDAQ daily/minute price collector with TimescaleDB"
requires-python = ">=3.11"
dependencies = [
    # Database
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    # Data sources
    "pykrx>=1.1.1",  # >=1.1.1 needed for KRX Data Marketplace login (2026.01 정책 변경)
    "finance-datareader>=0.9.96",  # complementary/fallback source (see src/collectors/daily_fdr.py)
    "yfinance>=0.2.40",  # US market daily prices (see src/collectors/daily_us_yf.py)
    "opendartreader>=0.2.0",  # DART (금융감독원 전자공시) API client (see src/collectors/dart_*.py)
    # .env loader for KRX_ID/KRX_PW + DB creds (loaded explicitly in pipeline entrypoints)
    "python-dotenv>=1.0.0",
    # HTTP client for KIS API (kis/ module — planned)
    "httpx>=0.27.0",
    # HTML parser for FnGuide consensus scraper (src/collectors/consensus_fnguide.py)
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",  # bs4 backend; required for BeautifulSoup(..., "lxml")
    # Data manipulation
    "pandas>=2.2.0",
    # Config & utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.0",
    "tenacity>=8.3.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    # REST API (src/api/*) + in-process scheduler. APScheduler 3.x line
    # (AsyncIOScheduler) is stable and integrates with asyncio; v4 is still
    # pre-release and the API surface has changed.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.4,<4.0",
    # Phase 2 ML: LightGBM regression on cross-sectional alpha factors.
    # GBDT remains the strongest baseline on equity ranking tasks
    # (Qlib Alpha360 benchmarks); imported only by src/research/model_lgbm.py.
    "lightgbm>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    # VS Code에서 .ipynb 실행에는 ipykernel만 있으면 충분
    # jupyter lab GUI가 필요하면 "jupyterlab>=4.0.0" 추가 (단, Windows에서 긴경로 활성화 필요)
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 코드가 `from src.db...` 형태로 import하므로 `src`를 패키지 루트로 명시.
# (src-layout의 표준 방식이 아니라, 프로젝트가 실제로 src를 네임스페이스처럼 쓰고 있음)
packages = [
    "src",
    "src.api",
    "src.api.routers",
    "src.collectors",
    "src.db",
    "src.kis",
    "src.pipelines",
    "src.research",
    "src.trading",
    "src.trading.bot",
    "src.trading.factors",
    "src.trading.repositories",
    "src.trading.simulator",
    "src.trading.strategy",
    "src.trading.strategy.strategies",
    "src.utils",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
